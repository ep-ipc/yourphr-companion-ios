name: YourPHRCompanion
options:
  bundleIdPrefix: org.yourphr
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SUPPORTS_MACCATALYST: false
    ENABLE_PREVIEWS: YES
    ENABLE_TESTABILITY: YES
targets:
  YourPHRCompanion:
    type: application
    platform: iOS
    sources:
      - path: YourPHRCompanion
        excludes:
          - Info.plist
          - "*.entitlements"
    info:
      path: YourPHRCompanion/Info.plist
      properties:
        NSHealthShareUsageDescription: YourPHR Companion reads heart rate, blood pressure, sleep, steps, weight, oxygen saturation, and body temperature from Apple Health so it can send those samples to your YourPHR instance. Nothing is written back to Apple Health.
        NSCameraUsageDescription: Camera access is used only to scan the pairing QR code shown in YourPHR.
        NSLocalNetworkUsageDescription: YourPHR Companion connects to your YourPHR server on the local network to pair this phone and send health samples.
        NSBonjourServices:
          - _yourphr._tcp
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - org.yourphr.companion.refresh
        CFBundleURLTypes:
          - CFBundleURLName: org.yourphr.companion.device
            CFBundleURLSchemes:
              - yourphr-device
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: YourPHRCompanion/YourPHRCompanion.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.yourphr.companion
        PRODUCT_NAME: YourPHRCompanion
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: YourPHRCompanion/Info.plist
        CODE_SIGN_ENTITLEMENTS: YourPHRCompanion/YourPHRCompanion.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    scheme:
      testTargets:
        - YourPHRCompanionTests
  YourPHRCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - YourPHRCompanionTests
    dependencies:
      - target: YourPHRCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.yourphr.companion.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/YourPHRCompanion.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/YourPHRCompanion"
